name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1-stable

jobs:
  smoke-test:
    name: Script smoke test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot headless
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
      - name: Import project assets
        run: godot --headless --path . --import || true
      - name: Run 90 headless frames of the full game
        run: godot --headless --path . --quit-after 90 -- --smoke

  build-apk:
    name: Export ARM64 APK
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub ubuntu runners ship a preinstalled Android SDK (ANDROID_HOME set)
      - name: Install Android platform + build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install Godot headless + export templates
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -sL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d tmpl
          mv tmpl/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Point Godot at the Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path=\"${ANDROID_HOME}\"" \
            > "$HOME/.config/godot/editor_settings-4.4.tres"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Generate debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keysize 2048 -validity 10000 \
            -keypass android -storepass android -keystore "$PWD/debug.keystore" \
            -dname "CN=Android Debug,O=Android,C=US"
          sed -i "s|keystore/debug=\"debug.keystore\"|keystore/debug=\"$PWD/debug.keystore\"|" export_presets.cfg

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" "build/GrandOpenWorld.apk"

      - name: Validate APK
        run: |
          test -f build/GrandOpenWorld.apk || { echo "::error::APK was not produced"; exit 1; }
          SIZE=$(stat -c%s build/GrandOpenWorld.apk)
          echo "APK size: $SIZE bytes"
          unzip -l build/GrandOpenWorld.apk | tee apk_contents.txt
          unzip -l build/GrandOpenWorld.apk | grep -q "lib/arm64-v8a" || { echo "::error::ARM64 native library missing"; exit 1; }
          unzip -l build/GrandOpenWorld.apk | grep -q "classes.dex" || { echo "::error::classes.dex missing"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrandOpenWorld-apk
          path: build/GrandOpenWorld.apk
          if-no-files-found: error

      - name: Publish release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/GrandOpenWorld.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
